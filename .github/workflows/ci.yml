name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same gates on the tagged commit before anything is published.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:unit

  differential:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The harness tests itself first: a gate that never fails is worth nothing.
      - run: npm run test:harness
      # The engine (src) against upstream xpath: random documents with the whole corpus, the mutation scenarios, and
      # random expressions. A candidate that does not come back within the time limit fails the run.
      - run: npm run test:differential

  # The bugsee/xpath fork that the appserver ships today, against upstream, as before: documents and scenarios block.
  # The expression fuzzer is informational for the fork: the fork has no hoisting of nested absolute paths, so it does
  # not come back on some random `//a[//b[...]]` expressions (the engine does; the engine's run above gates).
  fork:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:differential:fork
      - run: npm run test:fuzz-expr:fork
        continue-on-error: true

  hostile:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Judged with the candidate's baseline (baselines/xpath-fork.json): known-slow shapes are listed, not failed.
      - run: npm run test:hostile

  engine:
    runs-on: ubuntu-latest
    needs: check
    env:
      CANDIDATE: ./src/index.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Gated: xmldom 0.8 (what the SAML libraries use): equal to upstream except for class 5 (CLASSIFY=ns-duplicate,
      # see the README); xmldom 0.9: the split gate (CLASSIFY=all: no difference where both engines answer, apart from
      # class 5, and the rest must fall in the documented classes). The other DOMs are compared in the nightly run and
      # do not gate.
      - run: CLASSIFY=ns-duplicate node test/fuzz.ts xmldom08 300 31 all
      - run: CLASSIFY=all node test/fuzz.ts xmldom09 300 31 all
      - run: CLASSIFY=ns-duplicate CANDIDATE=./test/support/candidate-slow.ts node test/fuzz.ts xmldom08 150 32 all
      - run: node test/mutation.ts
      - run: CLASSIFY=ns-duplicate node test/fuzz-expr.ts xmldom08 60 100 31 ns 5000
      - run: CLASSIFY=all node test/fuzz-expr.ts xmldom09 60 100 31 ns 5000
      - run: node test/mode-agreement.ts 60 100 31
      # Strict following::/preceding:: fast paths against the strict slow path (the reference), on both gated DOMs.
      - run: node test/strict-axes-fuzz.ts 60 100 31 xmldom08
      # Strict mode against an independent reference written from the Recommendation (no code shared with the engine).
      - run: node test/strict-oracle.ts xmldom08 60 150 31 ns
      - run: node test/strict-oracle.ts xmldom09 40 150 31 ns
      - run: node test/strict-axes-fuzz.ts 40 100 31 xmldom09
      # Cases marked engineOnly (the limits, the resolver and id() paths) run only for the engine; every case has an
      # oracle digest, and the cases the engine must refuse have to stop with a typed error.
      - run: HOSTILE_ENGINE_CASES=1 HOSTILE_STRICT=1 node test/hostile.ts
      # Signature wrapping and other tampering with a signed response through samlify and xml-crypto, upstream against
      # the engine: the same accept or reject, the same extracted values.
      - run: npm run fixtures
      - run: npm run test:wrapping

  # The shipped output, not the sources: build once, then judge dist/ the way a consumer runs it.
  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The tests and benchmarks compiled to plain JavaScript, their engine import pointed at dist/, so that Node 20
      # (which cannot strip types) runs the same suites.
      - run: npm run build:tests
      # A TypeScript consumer (ES2022 + DOM libraries, no Node typings) compiles against the declarations through the
      # exports map, for both the "import" and the "require" condition.
      - run: npm run test:dist:types
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built
          path: |
            dist
            dist-tests
          retention-days: 1

  # dist/ on every supported Node: ES module and CommonJS imports through the exports map, the syntax check (ES2022 and
  # nothing newer, no TypeScript, no node: imports), `npm pack` content, the unit tests, and a reduced differential
  # and hostile gate, all with the candidate pointed at dist/ (never at src/).
  built:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built
      - run: node --version && npm run test:built

  # The ES module build in real browsers: a few expressions on DOMParser documents (namespaces, an HTML document, the
  # budget and time-limit errors) and the same expressions through upstream xpath, compared in the page.
  browsers:
    # Pinned to 24.04, Playwright's supported baseline, so that the ubuntu-latest move to 26.04 cannot change the job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built
      # The browser's system packages come from apt, and the runners' Ubuntu mirrors fail transiently ("Temporary failure
      # resolving"). The install is retried, each attempt bounded in time. Chromium and Firefox then fall back to what the
      # runner image already has; WebKit has no such fallback (it needs system libraries only apt installs), so a persistent
      # apt failure fails the WebKit job rather than being waved through.
      - name: Install the browser and its system packages
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if timeout 180 npx playwright install --with-deps ${{ matrix.browser }}; then exit 0; fi
            echo "::warning::attempt $attempt to install ${{ matrix.browser }} with its system packages failed"
            sleep $((attempt * 20))
          done
          if [ "${{ matrix.browser }}" = webkit ]; then exit 1; fi
          echo "::warning::installing ${{ matrix.browser }} without system packages"
          npx playwright install ${{ matrix.browser }}
      - run: node test/browser/run.mjs ${{ matrix.browser }}

  # The suite is tested too: each mutant is the engine with one deliberately wrong change (the reviewer's planted off-by-one
  # among them); the checks must fail on every one.
  mutants:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:mutants
