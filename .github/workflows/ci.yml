name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:unit

  differential:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The harness tests itself first: a gate that never fails is worth nothing.
      - run: npm run test:harness
      # The candidate (the bugsee/xpath fork by default) against upstream xpath: random documents with the whole
      # corpus, the mutation scenarios, and random expressions.
      - run: npm run test:differential

  hostile:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Judged with the candidate's baseline (baselines/xpath-fork.json): known-slow shapes are listed, not failed.
      - run: npm run test:hostile

  engine:
    runs-on: ubuntu-latest
    needs: check
    env:
      CANDIDATE: ./src/index.ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Gated: xmldom 0.8 (what the SAML libraries use): equal to upstream except for class 5 (CLASSIFY=ns-duplicate,
      # see the README); xmldom 0.9: the split gate (CLASSIFY=all: no difference where both engines answer, apart from
      # class 5, and the rest must fall in the documented classes). The other DOMs are compared in the nightly run and
      # do not gate.
      - run: CLASSIFY=ns-duplicate node test/fuzz.ts xmldom08 300 31 all
      - run: CLASSIFY=all node test/fuzz.ts xmldom09 300 31 all
      - run: CLASSIFY=ns-duplicate CANDIDATE=./test/support/candidate-slow.ts node test/fuzz.ts xmldom08 150 32 all
      - run: node test/mutation.ts
      - run: CLASSIFY=ns-duplicate node test/fuzz-expr.ts xmldom08 60 100 31 ns 5000
      - run: CLASSIFY=all node test/fuzz-expr.ts xmldom09 60 100 31 ns 5000
      - run: HOSTILE_STRICT=1 node test/hostile.ts

  # The shipped output, not the sources: build once, then judge dist/ the way a consumer runs it.
  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The tests and benchmarks compiled to plain JavaScript, their engine import pointed at dist/, so that Node 20
      # (which cannot strip types) runs the same suites.
      - run: npm run build:tests
      # A TypeScript consumer (ES2022 + DOM libraries, no Node typings) compiles against the declarations through the
      # exports map, for both the "import" and the "require" condition.
      - run: npm run test:dist:types
      - uses: actions/upload-artifact@v7
        with:
          name: built
          path: |
            dist
            dist-tests
          retention-days: 1

  # dist/ on every supported Node: ES module and CommonJS imports through the exports map, the syntax check (ES2022 and
  # nothing newer, no TypeScript, no node: imports), `npm pack` content, the unit tests, and a reduced differential
  # and hostile gate, all with the candidate pointed at dist/ (never at src/).
  built:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: built
      - run: node --version && npm run test:built

  # The ES module build in real browsers: a few expressions on DOMParser documents (namespaces, an HTML document, the
  # budget and time-limit errors) and the same expressions through upstream xpath, compared in the page.
  browsers:
    # Pinned: Playwright's system packages come from apt, and on the ubuntu-latest image (26.04) the Ubuntu mirrors did
    # not resolve at all during the first runs of this job ("Temporary failure resolving"); 24.04 is Playwright's
    # supported baseline.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: built
      # The browser's system packages come from apt; the runners' mirrors fail transiently ("Temporary failure resolving"),
      # so the step is bounded in time and retried rather than hanging for the length of the job.
      - name: Install the browser and its system dependencies
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "attempt $attempt failed"; sleep 20
          done
          exit 1
      - run: node test/browser/run.mjs ${{ matrix.browser }}
