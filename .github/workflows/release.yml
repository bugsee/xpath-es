name: release

# A release is a tag `v<version>` (v1.2.3, or v1.2.3-rc.1 for a prerelease, which goes to the npm dist-tag `next`) pushed by
# a maintainer to a commit that is on main. Nothing here runs for a branch or a pull request. The steps, in order:
#
#   guard    the tag is on main, and the tag, package.json and CHANGELOG.md agree
#   ci       the full CI of this repository on the tagged commit
#   pack     one tarball, built from that commit, with its SHA-256; this exact file is what is published
#   publish  `npm publish` of that tarball with provenance, through npm trusted publishing (OIDC; no token is stored),
#            after a maintainer approves the `npm-release` environment
#   release  the GitHub release, with the tarball and its checksum
#
# See RELEASING.md for the one-time setup (the npm trusted publisher, the environment, the tag ruleset).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      dist_tag: ${{ steps.check.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # A tag can be pushed to any commit, a branch's included; only what is on main may be released.
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::the tagged commit is not on main"
            exit 1
          }
      - id: check
        run: node scripts/release-check.ts "$GITHUB_REF_NAME"

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  pack:
    needs: [guard, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The checks of the built package that CI runs on the shipped output: the exports map, the syntax level, the content
      # of the tarball.
      - run: npm run test:dist
      - name: Pack
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          sha256sum ./*.tgz | tee SHA256SUMS
          tar -tzf ./*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [guard, pack]
    runs-on: ubuntu-latest
    # A maintainer approves the publication here (the environment's required reviewers; see RELEASING.md).
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/xpath-es/v/${{ needs.guard.outputs.version }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing and the provenance statement
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - name: The tarball is the one that was checked
        working-directory: package
        run: sha256sum --check SHA256SUMS
      - name: Publish
        working-directory: package
        env:
          DIST_TAG: ${{ needs.guard.outputs.dist_tag }}
        run: npm publish ./*.tgz --provenance --access public --tag "$DIST_TAG"

  release:
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          node scripts/release-check.ts --notes "$VERSION" > notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" package/*.tgz package/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
